name: BuddyForStudy CI

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  push:
    branches: ["main", "test"]
  pull_request:
    branches: ["main"]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - name: Audit frontend dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=moderate
      - name: Frontend lint
        run: npm run lint
      - run: npm run typecheck
      - name: Frontend unit tests
        run: npm run test:unit
      - name: Vercel deployment config tests
        run: node --test tests/deploymentConfig.test.cjs
      - name: Build production app
        env:
          VITE_PUBLIC_SITE_URL: "https://buddyforstudy.example"
          VITE_INTENT_V2: "false"
          VITE_ASYNC_ROADMAP: "false"
        run: npm run build
      - name: Install Playwright for browser smoke tests
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/buddy-preview.log 2>&1 &
          echo $! > /tmp/buddy-preview.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/buddy-preview.log
          exit 1
      - name: Browser navigation smoke tests
        run: npx playwright test tests/navigation.e2e.spec.ts tests/admin-access.e2e.spec.ts tests/google-auth.e2e.spec.ts tests/auth-accessibility.e2e.spec.ts

  backend:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: server
    env:
      NODE_ENV: test
      MONGO_URI: mongodb://127.0.0.1:27017/buddyforstudy_test
      JWT_SECRET: ci-test-secret
      RAZORPAY_KEY_ID: rzp_test_ci
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install frontend ESLint toolchain
        working-directory: client
        run: npm ci
      - run: npm ci
      - name: Audit backend dependency vulnerabilities
        run: npm audit --audit-level=moderate
      - name: Backend lint
        run: npm run lint
      - name: Validate production config preflight
        env:
          NODE_ENV: "production"
          MONGO_URI: "mongodb+srv://ci-user:ci-only-password@cluster.example.net/buddyforstudy?retryWrites=true&w=majority"
          JWT_SECRET: "ci-only-randomized-preflight-secret-with-enough-unique-characters-67890"
          CLIENT_URL: "https://buddyforstudy.example"
          API_URL: "https://api.buddyforstudy.example"
          TRUST_PROXY_HOPS: "1"
          RAZORPAY_KEY_ID: "rzp_live_0123456789abcdef"
          RAZORPAY_KEY_SECRET: "ci-only-provider-secret-0123456789"
          RAZORPAY_WEBHOOK_SECRET: "ci-only-webhook-secret-0123456789abcdef0123456789"
          SMTP_HOST: "smtp.example.net"
          SMTP_PORT: "587"
          SMTP_SECURE: "false"
          SMTP_USER: "ci-only@example.net"
          SMTP_PASS: "ci-only-smtp-password-12345"
          MAIL_FROM: "ci-only@example.net"
        run: node src/scripts/validateProductionConfig.js
      - run: npm test
      - name: Build with AI selector comparison (mock mode only)
        run: node ../scripts/compareSelectors.js
      - name: Check all server JavaScript syntax
        run: find src -type f -name "*.js" -print0 | xargs -0 -n1 node --check

  production-release-gate:
    name: Production release gate
    if: always()
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    steps:
      - name: Require all CI jobs to pass
        env:
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
        run: |
          if [[ "$FRONTEND_RESULT" != "success" || "$BACKEND_RESULT" != "success" ]]; then
            echo "::error::Production release is blocked. frontend=$FRONTEND_RESULT backend=$BACKEND_RESULT"
            exit 1
          fi
          echo "Production release gate passed: frontend and backend are both successful."
