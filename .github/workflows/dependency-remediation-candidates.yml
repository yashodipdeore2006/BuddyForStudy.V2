name: Generate dependency remediation candidates
# Lockfile commits are gated by clean installs, high-severity audit checks, and source verification.

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/dependency-remediation-candidates.yml"
      - "package.json"
      - "server/package.json"

permissions:
  contents: write

jobs:
  refresh-and-verify:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - name: Generate frontend lockfile from manifest
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --no-fund
      - name: Install frontend dependencies cleanly
        run: npm ci
      - name: Apply compatible frontend security fixes
        run: |
          npm audit fix --package-lock-only --ignore-scripts --no-fund || true
          npm ci
          npm audit --audit-level=moderate
      - name: Generate backend lockfile from manifest
        working-directory: server
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --no-fund
      - name: Install backend dependencies cleanly
        working-directory: server
        run: npm ci
      - name: Apply compatible backend security fixes
        working-directory: server
        run: |
          npm audit fix --package-lock-only --ignore-scripts --no-fund || true
          npm ci
          npm audit --omit=dev --audit-level=moderate
      - name: Verify backend lint and tests
        working-directory: server
        env:
          NODE_ENV: test
          MONGO_URI: mongodb://127.0.0.1:27017/buddyforstudy_test
          JWT_SECRET: ci-test-secret
          RAZORPAY_KEY_ID: rzp_test_ci
        run: |
          npm run lint
          npm test
      - name: Verify frontend lint typecheck unit tests and production build
        run: |
          npm run lint
          npm run typecheck
          npm run test:unit
          VITE_PUBLIC_SITE_URL=https://buddyforstudy.example npm run build
      - name: Upload dependency lockfile candidates for audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-dependency-lockfiles
          path: |
            package-lock.json
            server/package-lock.json
          if-no-files-found: error
          retention-days: 3
      - name: Commit and push verified lockfile refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json server/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfiles already match approved manifests; no commit required."
            exit 0
          fi
          git commit -m "chore: refresh verified dependency lockfiles"
          git push origin HEAD:main
