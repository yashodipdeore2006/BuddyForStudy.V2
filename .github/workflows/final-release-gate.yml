name: Final release approval gate

run-name: Final release approval — buddy-for-study-v2.2

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify-exact-commit-ci:
    if: github.ref == 'refs/heads/buddy-for-study-v2.2'
    name: Verify CI for the exact candidate commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      candidate_sha: ${{ steps.check.outputs.candidate_sha }}
      ci_run_url: ${{ steps.check.outputs.ci_run_url }}
    steps:
      - name: Require successful backend, frontend and release-gate jobs for this SHA
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const { GITHUB_TOKEN, CANDIDATE_SHA, REPOSITORY } = process.env;
          if (!GITHUB_TOKEN || !CANDIDATE_SHA || !REPOSITORY) {
            throw new Error("Missing GitHub API verification context.");
          }

          async function githubJson(url) {
            const response = await fetch(url, {
              headers: {
                Authorization: "Bearer " + GITHUB_TOKEN,
                Accept: "application/vnd.github+json",
                "X-GitHub-Api-Version": "2022-11-28"
              }
            });
            if (!response.ok) {
              throw new Error("GitHub API verification failed with HTTP " + response.status + ".");
            }
            return response.json();
          }

          const endpoint = new URL("https://api.github.com/repos/" + REPOSITORY + "/actions/runs");
          endpoint.searchParams.set("head_sha", CANDIDATE_SHA);
          endpoint.searchParams.set("per_page", "100");
          const response = await githubJson(endpoint.toString());
          const candidates = (response.workflow_runs || [])
            .filter((run) =>
              run.name === "BuddyForStudy CI" &&
              run.head_sha === CANDIDATE_SHA
            )
            .sort((left, right) => Date.parse(right.created_at) - Date.parse(left.created_at));

          const ciRun = candidates[0];
          if (!ciRun) {
            throw new Error("No BuddyForStudy CI run was found for the exact candidate SHA.");
          }
          if (ciRun.status !== "completed" || ciRun.conclusion !== "success") {
            throw new Error("The latest BuddyForStudy CI run for this SHA is not completed successfully.");
          }

          const jobsResponse = await githubJson(
            "https://api.github.com/repos/" + REPOSITORY +
            "/actions/runs/" + ciRun.id + "/jobs?per_page=100"
          );
          const jobs = jobsResponse.jobs || [];
          const requiredJobs = ["backend", "frontend", "Production release gate"];
          const failedJobs = requiredJobs.filter((name) => {
            const job = jobs.find((candidate) => candidate.name === name);
            return !job || job.status !== "completed" || job.conclusion !== "success";
          });
          if (failedJobs.length) {
            throw new Error("Required exact-SHA CI jobs are missing or unsuccessful: " + failedJobs.join(", "));
          }

          const output = [
            "candidate_sha=" + CANDIDATE_SHA,
            "ci_run_url=" + ciRun.html_url
          ].join("\n") + "\n";
          await import("node:fs/promises").then(({ appendFile }) =>
            appendFile(process.env.GITHUB_OUTPUT, output)
          );
          await import("node:fs/promises").then(({ appendFile }) =>
            appendFile(
              process.env.GITHUB_STEP_SUMMARY,
              "## Exact-commit CI: PASS\n\n" +
              "- Candidate: `" + CANDIDATE_SHA + "`\n" +
              "- CI run: " + ciRun.html_url + "\n" +
              "- Required jobs: backend, frontend, Production release gate\n"
            )
          );
          NODE

  verify-staging:
    name: Verify deployed staging services (read-only)
    needs: verify-exact-commit-ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: staging
      deployment: false
    steps:
      - name: Check out the exact candidate commit
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.verify-exact-commit-ci.outputs.candidate_sha }}
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Run strict read-only staging operations verification
        working-directory: server
        env:
          DEPLOYMENT_URL: ${{ vars.STAGING_API_URL }}
          FRONTEND_DEPLOYMENT_URL: ${{ vars.STAGING_FRONTEND_URL }}
          EXPECTED_GOOGLE_CLIENT_ID: ${{ vars.STAGING_GOOGLE_CLIENT_ID }}
          EXPECTED_BACKGROUND_WORKER_MODE: ${{ vars.STAGING_BACKGROUND_WORKER_MODE }}
          OPERATIONS_ADMIN_TOKEN: ${{ secrets.STAGING_OPERATIONS_ADMIN_TOKEN }}
          REQUIRE_OPERATIONS_HEALTH: "true"
        run: node src/scripts/verifyDeployment.js

  record-release-approval:
    name: Record human release approval (no deployment)
    needs:
      - verify-exact-commit-ci
      - verify-staging
    runs-on: ubuntu-latest
    timeout-minutes: 2
    environment:
      name: production-release
      deployment: false
    steps:
      - name: Record the approved candidate and evidence
        env:
          CANDIDATE_SHA: ${{ needs.verify-exact-commit-ci.outputs.candidate_sha }}
          CI_RUN_URL: ${{ needs.verify-exact-commit-ci.outputs.ci_run_url }}
        shell: bash
        run: |
          {
            echo "## Release approval gate: PASS"
            echo
            echo "- Candidate: `$CANDIDATE_SHA`"
            echo "- Exact-SHA CI: [verified]($CI_RUN_URL)"
            echo "- Staging operations verification: passed"
            echo "- Human approval: the `production-release` environment gate was satisfied"
            echo
            echo "**No deployment was performed by this workflow.** A separate, explicitly approved deployment procedure is still required."
          } >> "$GITHUB_STEP_SUMMARY"
