name: Repair server lockfile

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-server-lockfile.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Regenerate server lockfile
        working-directory: server
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify clean install
        working-directory: server
        run: npm ci
      - name: Commit repaired lockfile
        run: |
          if git diff --quiet -- server/package-lock.json; then
            echo "Lockfile already in sync."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/package-lock.json
          git commit -m "fix: synchronize server npm lockfile"
          git push origin HEAD:main
