# Render Blueprint for the BuddyForStudy API with bounded inline background execution.
# A standalone worker is an optional later upgrade; secrets are never committed here.
# Production deploys are gated on linked GitHub checks passing.
envVarGroups:
  - name: buddyforstudy-production-runtime
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: BACKGROUND_WORKER_MODE
        value: inline
      - key: PAYMENTS_ENABLED
        value: "false"
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: USE_CURATION_ENGINE_FOR_AI
        value: "false"
      - key: INTENT_V2
        value: "false"
      - key: ASYNC_ROADMAP
        value: "false"
      - key: YT_COMBINED_SEARCH
        value: "false"
      - key: ENABLE_TRUSTED_CHANNELS
        value: "false"
      - key: ENABLE_CURATION_COMPLIANCE_WORKERS
        value: "false"
      - key: AI_PRIVATE_COURSES_SKIP_REVIEW
        value: "false"
      - key: YT_DAILY_QUOTA_BUDGET
        value: "9000"
      - key: YT_SEARCH_DAILY_LIMIT
        value: "90"
      - key: YT_SOFT_LIMIT_PCT
        value: "80"
      - key: NODE_CACHE_TTL_DAYS
        value: "14"
      - key: NODE_CONCURRENCY
        value: "3"
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.1"

services:
  - type: web
    name: buddyforstudy-api
    runtime: node
    region: singapore
    branch: main
    rootDir: server
    buildCommand: npm ci
    startCommand: npm run start
    healthCheckPath: /api/health/ready
    maxShutdownDelaySeconds: 120
    autoDeployTrigger: checksPass
    envVars:
      - fromGroup: buddyforstudy-production-runtime
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: API_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: YOUTUBE_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: WEB_PUSH_VAPID_PUBLIC_KEY
        sync: false
      - key: WEB_PUSH_VAPID_PRIVATE_KEY
        sync: false
      - key: WEB_PUSH_SUBJECT
        sync: false
